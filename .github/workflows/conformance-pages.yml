# Builds and publishes the zxplay_go conformance dashboard to GitHub Pages.
# The page is generated by packages/emulator-core/zxplay_go/conformance/confgen
# from the conformance manifest, the actual `go test -json` run, and the
# known-gaps register. See conformance/README.md for the schema and rules.
name: Conformance dashboard

on:
  push:
    branches: [main]
    paths:
      - 'packages/emulator-core/**'
      - '.github/workflows/conformance-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/emulator-core/zxplay_go/go.mod
          cache-dependency-path: packages/emulator-core/zxplay_go/go.sum

      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      # Stage the licensed NextZXOS ROMs by fetching the OFFICIAL distro —
      # the same URL install.DefaultDistroURL pins (pkg/next/install/
      # download.go) — so the real-ROM boot row (boot-nextzxos) runs on the
      # published dashboard instead of skipping. The ROMs are licensed
      # content, gitignored and never committed (roms/next/); fetching
      # fresh from specnext.com per build keeps them out of the repo and
      # its artifacts. Best-effort: if specnext.com is unreachable the
      # gated tests skip cleanly and the dashboard still publishes — the
      # row goes grey again rather than the build going red.
      - name: Stage licensed Next ROMs from the official distro
        working-directory: packages/emulator-core/zxplay_go
        run: |
          if curl -fsSL --retry 3 --max-time 300 -o /tmp/sn-complete.zip \
               https://www.specnext.com/distro/24.11/sn-complete-24.11.zip \
             && mkdir -p roms/next \
             && unzip -o -j /tmp/sn-complete.zip \
                  machines/next/enNextZX.rom machines/next/enNxtmmc.rom \
                  -d roms/next; then
            ls -l roms/next
          else
            echo "::warning::Next distro fetch failed; real-ROM boot tests will skip"
          fi

      # Full suite (not -short) so zexdoc/zexall run. Tests gated on assets
      # the previous step could not stage (or on a staged SD image, which
      # CI never has) skip cleanly, and a failing test must still publish
      # (it shows as a red row), so the exit code is deliberately swallowed.
      - name: Run zxplay_go test suite
        working-directory: packages/emulator-core/zxplay_go
        run: go test -json -count=1 ./... > /tmp/gotest.json || true

      - name: Generate dashboard
        working-directory: packages/emulator-core/zxplay_go/conformance/confgen
        run: >
          go run .
          -manifest ../manifest.json
          -results /tmp/gotest.json
          -gaps ../../docs/architecture/known-gaps.md
          -vhdl ../../VHDL_CONFORMANCE.md
          -out /tmp/site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
