table:
  name: project_file
  schema: public
object_relationships:
  - name: project
    using:
      foreign_key_constraint_on: project_id
insert_permissions:
  - role: zxplay-user
    permission:
      check:
        project:
          owner_user_id:
            _eq: X-Hasura-User-Id
      columns:
        - project_id
        - name
        - content
        - is_binary
select_permissions:
  - role: public
    permission:
      columns:
        - file_id
        - project_id
        - name
        - content
        - is_binary
        - created_at
        - updated_at
      filter:
        project:
          is_public:
            _eq: true
      allow_aggregations: true
  - role: zxplay-user
    permission:
      columns:
        - file_id
        - project_id
        - name
        - content
        - is_binary
        - created_at
        - updated_at
      filter:
        _or:
          - project:
              owner_user_id:
                _eq: X-Hasura-User-Id
          - project:
              is_public:
                _eq: true
      allow_aggregations: true
update_permissions:
  - role: zxplay-user
    permission:
      columns:
        - name
        - content
        - is_binary
      filter:
        project:
          owner_user_id:
            _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: zxplay-user
    permission:
      filter:
        project:
          owner_user_id:
            _eq: X-Hasura-User-Id
