table:
  name: project
  schema: public
object_relationships:
  - name: owner
    using:
      foreign_key_constraint_on: owner_user_id
  - name: user
    using:
      foreign_key_constraint_on: owner_user_id
array_relationships:
  - name: files
    using:
      foreign_key_constraint_on:
        column: project_id
        table:
          name: project_file
          schema: public
  - name: stars
    using:
      foreign_key_constraint_on:
        column: project_id
        table:
          name: project_star
          schema: public
insert_permissions:
  - role: zxplay-user
    permission:
      check: {}
      set:
        owner_user_id: x-hasura-User-Id
      columns:
        - code
        - lang
        - machine
        - title
        - slug
        - is_public
select_permissions:
  - role: public
    permission:
      columns:
        - project_id
        - title
        - code
        - owner_user_id
        - updated_at
        - created_at
        - lang
        - machine
        - is_public
        - slug
        - display_order
      filter:
        is_public:
          _eq: true
      allow_aggregations: true
  - role: zxplay-user
    permission:
      columns:
        - code
        - created_at
        - display_order
        - lang
        - machine
        - owner_user_id
        - project_id
        - title
        - updated_at
        - is_public
        - slug
      filter:
        _or:
          - owner_user_id:
              _eq: X-Hasura-User-Id
          - is_public:
              _eq: true
      allow_aggregations: true
update_permissions:
  - role: zxplay-user
    permission:
      columns:
        - code
        - display_order
        - machine
        - title
        - is_public
        - slug
      filter:
        owner_user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: zxplay-user
    permission:
      filter:
        owner_user_id:
          _eq: X-Hasura-User-Id
